[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygog"
version = "0.1.0"
description = "Python CLI for Google services (Gmail, Calendar, Drive, Tasks, and more)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "pygog contributors" }
]
keywords = ["google", "gmail", "calendar", "drive", "tasks", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = [
    "typer[all]>=0.9.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-api-python-client>=2.100.0",
    "litellm>=1.0.0",
    "ddgs>=9.0.0",
    "keyring>=24.0.0",
    "json5>=0.9.14",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[project.scripts]
pygog = "pygog.__main__:main"
gog = "pygog.__main__:main"

[project.urls]
Homepage = "https://github.com/pygog/pygog"
Documentation = "https://github.com/pygog/pygog#readme"
Repository = "https://github.com/pygog/pygog"

[tool.hatch.build.targets.wheel]
packages = ["pygog"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
