[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygog"
dynamic = ["version"]
description = "Python CLI for Google services (Gmail, Calendar, Drive, Tasks, and more)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "pygog contributors" }
]
keywords = ["google", "gmail", "calendar", "drive", "tasks", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.9.0",
    "shellingham>=1.5.0",
    "rich>=13.0.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.1.0",
    "google-api-python-client>=2.100.0",
    "keyring>=24.0.0",
    "json5>=0.9.14",
    "tzlocal>=5.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
agent = [
    "litellm>=1.0.0",
    "ddgs>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage[toml]>=7.6.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7.3",
    "build>=1.2.2",
]

[project.scripts]
pygog = "pygog.__main__:main"
gog = "pygog.__main__:main"

[project.urls]
Homepage = "https://github.com/DhruvGarg111/py-goog-cli"
Documentation = "https://github.com/DhruvGarg111/py-goog-cli"
Repository = "https://github.com/DhruvGarg111/py-goog-cli"

[tool.hatch.build.targets.wheel]
packages = ["pygog"]

[tool.hatch.version]
path = "pygog/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_markers = true
strict_config = true
addopts = "--tb=short"

[tool.coverage.run]
branch = true
source = ["pygog"]

[tool.coverage.report]
fail_under = 30

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.flow", "googleapiclient.discovery", "googleapiclient.http"]
ignore_missing_imports = true
